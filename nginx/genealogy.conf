upstream backend {
    server backend:8000;
}

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # 扫描件原件可能数百 MB，放宽上传限制
    client_max_body_size 1024m;
    client_body_buffer_size 16m;
    client_body_temp_path /var/cache/nginx/client_temp;

    # 前端：index.html 禁用缓存，确保发布后用户刷新即拿到新版本（JS/CSS 带 hash 可长期缓存）
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
    location /assets/ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 后端 API
    location /api/ {
        proxy_pass http://backend/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # AI 推理可能慢；审核端单页重识别（整页长超时 + 分块兜底）最多可跑十几分钟，
        # 300s 会截断；导入流水线均为后台任务不受影响
        proxy_read_timeout 1800s;
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
    }

    # MinIO 文件
    location /files/ {
        proxy_pass http://minio:9000/genealogy/;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }

    # 证书安装工具下载（登录页「安装证书」按钮）：按 octet-stream 强制下载。
    # 不加长期缓存（工具二进制可能带 bug 修复更新，避免客户端沿用旧版本）。
    location /cert/ {
        root /usr/share/nginx;
        default_type application/octet-stream;
        add_header Content-Disposition "attachment";
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
